<script type="application/javascript">
  function searchNetwork() {
    Homey.showView('list_devices');
  }
  function enterManually() {
    Homey.showView('manual');
  }
  Homey.setTitle('Add Abra Linkbox+ Pro (4G)');
</script>

<header class="homey-header">
  <h1 class="homey-title">Add Abra Linkbox+ Pro (4G)</h1>
  <p class="homey-subtitle">Requires a Linkbox+ Pro (4G) connected by Ethernet, with BACnet enabled by Waterguard support. Linkbox+ WiFi and Waterguard+ Adapter are not supported.</p>
  <p class="homey-subtitle">Search the local network, or enter the IP address yourself.</p>
</header>

<button class="homey-button-primary-full" onclick="searchNetwork()">Search the network</button>
<button class="homey-button-secondary-full" onclick="enterManually()">Enter IP address manually</button>
